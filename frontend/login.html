<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Log in to your Transzo AI account to access your interpretation workspace and contacts.">
  <link rel="icon" type="image/png" href="/transzo-ai-icon.png">
  <link rel="apple-touch-icon" href="/transzo-ai-icon.png">
  <title>Log In · Transzo AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b0a;
      --panel: #111915;
      --line: #293a30;
      --ink: #f1f7f0;
      --muted: #9ba99e;
      --lime: #c8ff70;
      --mint: #72f0c1;
      --green: #c9f3a7;
      --red: #ff9b9b;
      --pad: clamp(18px, 4vw, 54px);
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at 85% -5%, #20412e 0%, transparent 37%), linear-gradient(180deg, #080d0b, #070b09 70%);
      display: flex;
      flex-direction: column;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; transition: all 0.18s ease; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 2px solid var(--lime);
      outline-offset: 3px;
    }

    /* Header */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px var(--pad);
      border-bottom: 1px solid #26372c;
      background: rgba(7, 11, 10, 0.84);
      backdrop-filter: blur(18px);
    }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 800; letter-spacing: -0.075em; text-decoration: none; color: var(--ink); }
    .brand-icon { width: 38px; height: 38px; border: 1px solid rgba(124, 231, 255, 0.25); border-radius: 11px; object-fit: cover; box-shadow: 0 0 18px rgba(124, 231, 255, 0.12); }
    .brand-name { color: var(--ink); }
    .brand-accent { color: var(--lime); }
    .brand small { font-size: 9px; color: var(--muted); letter-spacing: 0.15em; display: block; font-weight: 500; }
    
    .chip {
      border: 1px solid #c8ff7030;
      background: #c8ff700a;
      color: #d6e7d7;
      border-radius: 99px;
      padding: 8px 11px;
      font-size: 10px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    /* Auth Form Container */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px var(--pad);
    }
    .auth-card {
      width: min(440px, 100%);
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(18, 27, 22, 0.96), rgba(13, 19, 15, 0.98));
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }
    .auth-card:before {
      content: "";
      position: absolute;
      right: -50px;
      top: -70px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(200, 255, 112, 0.05);
      pointer-events: none;
    }

    .auth-head { margin-bottom: 24px; text-align: center; }
    .auth-head h1 { font: 400 32px Georgia, serif; margin: 0 0 8px; letter-spacing: -0.04em; }
    .auth-head p { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.6; }

    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
    .field label { font-size: 11px; color: #aebdb1; font-weight: 500; }
    
    input, select {
      width: 100%;
      border: 1px solid #304237;
      border-radius: 10px;
      padding: 12px 14px;
      background: #0b100d;
      color: var(--ink);
      font-size: 14px;
    }

    /* Password Wrap & Toggle Eye Button */
    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .password-wrap input {
      padding-right: 44px;
    }
    .toggle-eye {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.18s ease;
      border-radius: 6px;
    }
    .toggle-eye:hover {
      color: var(--lime);
    }

    .btn-submit {
      width: 100%;
      border: 1px solid var(--lime);
      border-radius: 10px;
      padding: 13px;
      background: var(--lime);
      color: #142016;
      font-size: 14px;
      font-weight: 750;
      margin-top: 8px;
    }
    .btn-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 25px rgba(200, 255, 112, 0.25); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-msg {
      color: var(--red);
      font-size: 12px;
      line-height: 1.5;
      min-height: 18px;
      margin-bottom: 12px;
    }
    .success-msg {
      color: var(--lime);
      font-size: 12px;
      line-height: 1.5;
      min-height: 18px;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .auth-footer a { color: var(--lime); text-decoration: none; font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }

    footer {
      border-top: 1px solid #26372c;
      padding: 20px var(--pad);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: #7d8c80;
      font-size: 10px;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <header class="top">
    <a href="/" class="brand"><img class="brand-icon" src="/transzo-ai-icon.png" alt=""><span class="brand-name">Transzo <span class="brand-accent">AI</span><small>LIVE INTERPRETER</small></span></a>
    <div class="chip">SECURE AUTHENTICATION</div>
  </header>

  <main>
    <div class="auth-card">
      <div class="auth-head">
        <h1>Welcome Back</h1>
        <p>Sign in with your email and password to access your workspace.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
            <button type="button" class="toggle-eye" id="togglePasswordBtn" title="Toggle Password Visibility" aria-label="Toggle password visibility">
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div id="statusMsg" class="error-msg" role="alert"></div>

        <button type="submit" id="submitBtn" class="btn-submit">Log In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/signup.html">Create an account</a>
      </div>
    </div>
  </main>

  <footer>
    <span>TRANSZO AI · AUTHENTICATION</span>
    <span>Powered by Firebase Auth</span>
  </footer>

  <script type="module">
    import { loginUser, redirectIfAuthenticated } from './auth.js';

    // Redirect if already logged in
    redirectIfAuthenticated();

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');

    // Check if user just registered successfully
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('registered') === 'true') {
      statusMsg.className = 'success-msg';
      statusMsg.textContent = '✓ Account created successfully! Please log in with your email and password.';
    }

    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePasswordBtn.querySelector('.eye-open').style.display = isPassword ? 'none' : 'block';
      togglePasswordBtn.querySelector('.eye-closed').style.display = isPassword ? 'block' : 'none';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusMsg.className = 'error-msg';
      statusMsg.textContent = '';

      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        statusMsg.textContent = 'Please enter both your email and password.';
        return;
      }

      if (password.length < 8) {
        statusMsg.textContent = 'Password must be at least 8 characters long.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating…';

      try {
        await loginUser({ email, password });
        window.location.href = '/dashboard';
      } catch (err) {
        statusMsg.className = 'error-msg';
        statusMsg.textContent = err.message || 'Invalid email or password. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
